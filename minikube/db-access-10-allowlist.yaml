# The only client addresses allowed to reach /db and db.jithendar.com. Edit both lists together.
#   122.177.247.138  the owner's Mac (public IP on 2026-11-04; home connections can change it: update and re-apply)
#   46.224.38.14     the Hetzner host itself (connections it makes to jithendar.com)
# Both are DENY policies on the Istio ingress gateway, which learns each visitor's address from the PROXY protocol the
# host's HAProxy sends (miniKube deploy/minikube/istio/edge, EnvoyFilter proxy-protocol; DB_ACCESS.md). Without it every
# client looks like a minikube node, which is not listed, so everything is refused: the lists
# fail closed. They live in the gateway's namespace, so a person applies them
# (scripts/manifests.sh db-access | kubectl --context mk4 apply -f -), never CI.
---
# /db (Adminer). Port 443 only (80 just redirects), and never the TCP host: for TCP, Istio drops a DENY rule's HTTP
# fields, and this rule would then refuse every PostgreSQL connection from a listed address too.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: db-allowlist
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: DENY
  rules:
  - to:
    - operation:
        ports: ["443"]
        paths: ["/db", "/db/*"]
    from:
    - source:
        notRemoteIpBlocks:
        - 122.177.247.138/32
        - 46.224.38.14/32
    when:
    - key: connection.sni
      notValues: ["db.jithendar.com"]
---
# db.jithendar.com (PostgreSQL over TLS, db-access-30-postgres-tls.yaml): decided on the TLS server name, before any
# byte reaches the database.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: db-tcp-allowlist
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: DENY
  rules:
  - from:
    - source:
        notRemoteIpBlocks:
        - 122.177.247.138/32
        - 46.224.38.14/32
    when:
    - key: connection.sni
      values: ["db.jithendar.com"]
