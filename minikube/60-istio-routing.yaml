# Routing for jithendar.com and www on the Istio ingress gateway (replaces the Traefik Ingresses and middlewares).
# The Gateway istio-ingress/jithendar-com, its certificate (Secret jithendar-com-gateway-tls, DNS-01) and response
# compression (zstd/br/gzip, text types, at least 1 KiB) are in the miniKube repo: deploy/minikube/istio/edge.
# The host's HAProxy still sends everything to Traefik, which passes these hosts to the gateway at the lowest priority,
# so the other paths on jithendar.com (/argocd, /db, /grafana, /moks, /roboshop, ...) stay on Traefik for now.
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: jithendar-com
  namespace: jithendar
spec:
  hosts:
  - jithendar.com
  - www.jithendar.com
  gateways:
  - istio-ingress/jithendar-com
  http:
  # http(s)://www.jithendar.com/* → https://jithendar.com/* in one hop, path and query kept.
  - name: www-to-apex
    match:
    - authority:
        prefix: www.jithendar.com
    redirect:
      scheme: https
      authority: jithendar.com
      redirectCode: 308
  - name: http-to-https
    match:
    - port: 80
    redirect:
      scheme: https
      redirectCode: 308
  - name: site
    # Tracing headers from the internet are dropped: Next.js continues any incoming W3C trace context, so a visitor
    # could pick the trace id that becomes their error reference, or send "-00" to switch off the trace, request
    # metrics and request log line for their own requests. (Istio's own tracing uses B3 headers, not these.)
    headers:
      request:
        remove:
        - traceparent
        - tracestate
        - baggage
    route:
    - destination:
        host: jithendar-com.jithendar.svc.cluster.local
        port:
          number: 80
