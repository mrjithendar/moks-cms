# Istio service mesh for namespace jithendar (label istio-injection=enabled, 00-namespace.yaml). Istio itself, its CNI
# plugin, Traefik's sidecar and the ingress gateway are in the miniKube repo (minikube-infrastructure). Prometheus is
# not in the mesh, and keeps scraping :9464 in plain text.
# - PeerAuthentication default: PERMISSIVE while anything on Traefik still routes into this namespace. Traefik has a
#   sidecar, but it sends to pod IPs with Host jithendar.com, so its sidecar passes requests through in plain text and
#   STRICT rejects them (/ and /db answered 502 on 2026-11-08). The Istio gateway sends mTLS; set both back to STRICT
#   once every public route here goes through it.
# - PeerAuthentication jithendar-com-metrics: the site's :9464 stays PERMISSIVE for Prometheus.
# - PeerAuthentication jithendar-postgres-remote: :5432 stays PERMISSIVE for db.jithendar.com, which Traefik still
#   forwards as plain TCP (db-access-30-postgres-tls.yaml); its NetworkPolicies decide who may connect.
# - NetworkPolicy istio-sidecars: what the sidecars themselves need, added to the pods the other policies isolate.
# Practice sandbox pods get no sidecar (label sidecar.istio.io/inject=false, and istiod's neverInjectSelector).
# PeerAuthentications are applied by a person (./deploy.sh), never by CI (scripts/ci-app-manifests.py).
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: jithendar
spec:
  mtls:
    mode: PERMISSIVE
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: jithendar-com-metrics
  namespace: jithendar
spec:
  selector:
    matchLabels:
      app: jithendar-com
  # No mode of its own: the rest of the pod follows `default`.
  portLevelMtls:
    "9464":
      mode: PERMISSIVE
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: jithendar-postgres-remote
  namespace: jithendar
spec:
  selector:
    matchLabels:
      app: jithendar-postgres
  portLevelMtls:
    "5432":
      mode: PERMISSIVE
---
# Only the pods other NetworkPolicies here already isolate, in both directions. Selecting a pod without a policy
# would cut off everything else it does. Sandbox pods are not listed: they have no sidecar.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: istio-sidecars
  namespace: jithendar
  labels:
    app.kubernetes.io/part-of: jithendar-com
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - jithendar-com
      - jithendar-db-ui
      - jithendar-postgres
      - jithendar-redis
      - practice-dispatcher
      - practice-executor-api
      - practice-redis
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # 15020: merged metrics and health; 15090: Envoy's own (Prometheus job envoy-stats).
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: 15020
      protocol: TCP
    - port: 15090
      protocol: TCP
  egress:
  # DNS, to resolve istiod.istio-system.svc. Postgres and Redis have no DNS rule of their own, so without this
  # their sidecars time out on the lookup and never get ready (outage 2026-11-08).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  # Configuration and certificates from istiod. Without them the proxy never gets ready and the application
  # never starts (holdApplicationUntilProxyStarts).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-system
    ports:
    - port: 15012
      protocol: TCP
