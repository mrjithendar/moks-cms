# PostgreSQL at db.jithendar.com:443. The Istio ingress gateway matches the TLS server name (SNI), terminates TLS with
# the wildcard certificate and forwards TCP to jithendar-postgres:5432 over the mesh (mTLS). A URL path cannot work for
# this: database clients speak PostgreSQL's protocol, not HTTP. Clients:
#   psql "host=db.jithendar.com port=443 dbname=jithendar user=jithendar_remote sslmode=verify-full sslrootcert=system sslnegotiation=direct"
# The Gateway's TLS server for this host, and the ALPN "postgresql" that libpq's direct TLS requires, are in the miniKube
# repo (deploy/minikube/istio/edge: gateway.tls). The IP allowlist is db-access-10-allowlist.yaml (AuthorizationPolicy
# db-tcp-allowlist), checked before this route.
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: jithendar-db
  namespace: jithendar
spec:
  hosts:
  - db.jithendar.com
  gateways:
  - istio-ingress/public
  tcp:
  - match:
    - port: 443
    route:
    - destination:
        host: jithendar-postgres.jithendar.svc.cluster.local
        port:
          number: 5432
---
# Adds to the jithendar-postgres policy in 10-postgres.yaml (policies are additive): the Istio gateway (the TCP route)
# and Adminer may connect too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jithendar-postgres-remote
  namespace: jithendar
spec:
  podSelector:
    matchLabels:
      app: jithendar-postgres
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-ingress
      podSelector:
        matchLabels:
          istio: ingressgateway
    - podSelector:
        matchLabels:
          app: jithendar-db-ui
    ports:
    - port: 5432
      protocol: TCP
