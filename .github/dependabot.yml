# Dependabot version updates. Pull requests run ci-moks-cms.yml (lint, typecheck, test, the SEO agent's checks, build,
# image). Merging to master pushes a new moks-cms image (the web app and the SEO agent in one image); sites run :latest.
#
# Minor and patch updates are grouped to keep the PR count down; majors arrive one PR each.
# Security updates are not grouped and are not held back by the cooldown.

version: 2

updates:
  # Next.js app: package.json + package-lock.json
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "deps(www)"
      include: scope
    labels:
      - dependencies
      - npm
    groups:
      tiptap:
        patterns:
          - "@tiptap/*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      next-react:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # @vercel/otel pins the OpenTelemetry SDK, and the SDK pins @opentelemetry/api to a narrow
      # range; moving them separately breaks `npm ci` with ERESOLVE (api 1.10.0, 2026-10-30).
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
          - "@vercel/otel"
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Tracks the Node major in .nvmrc and the Dockerfiles; bump those together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # SDK 2.x (required by @vercel/otel 2.x) accepts api <1.10. Remove once @vercel/otel supports
      # the 3.x SDK, then bump @vercel/otel, the SDK packages and the api together.
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      # typescript-eslint (via eslint-config-next) supports TypeScript <6.1 only; 7.0 breaks `npm run lint`
      # (2026-10-30). Remove once typescript-eslint supports TS 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    # package.json "overrides" force patched transitive dev packages that their parents still pin
    # (2026-11-09; alerts 1-3): esbuild under drizzle-kit's @esbuild-kit/core-utils (~0.18), postcss-selector-parser
    # under @tailwindcss/typography (6.0.10), minimatch 10 under eslint and typescript-eslint (^10). Drop each
    # override once its parent ships the fix (`npm ls <name>` without the override shows when).

  # The SEO agent (seo-agent/): pyproject.toml + uv.lock (exact pins). The two-week rule: cooldown 14 days here, and
  # tool.uv.exclude-newer = "2 weeks" for transitive dependencies on every re-lock.
  - package-ecosystem: uv
    directory: /seo-agent
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 14
    commit-message:
      prefix: "deps(seo-agent)"
    labels:
      - dependencies
      - python
    groups:
      seo-agent-minor-patch:
        update-types:
          - minor
          - patch

  # Base images in Dockerfile and Dockerfile.ci
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: "deps(docker)"
    labels:
      - dependencies
      - docker
    groups:
      node-images:
        patterns:
          - node
      # The runtime stage is python:<3.13>-slim-trixie with Node copied in (Dockerfile.ci): Python minors change the
      # wheel ABI and move with setup-python in ci-moks-cms.yml, so they are bumped by hand.
      python-images:
        patterns:
          - python
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Actions in .github/workflows (pinned by commit SHA; Dependabot updates the SHA and the comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: "deps(ci)"
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
