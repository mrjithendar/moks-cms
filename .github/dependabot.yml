# Dependabot version updates. Pull requests run the `check` job in ci-jithendar-com.yml (lint,
# typecheck, test, build, render manifests). Merging to master releases an image; ./deploy.sh still
# has to be run to roll it out.
#
# Minor and patch updates are grouped to keep the PR count down; majors arrive one PR each.
# Security updates are not grouped and are not held back by the cooldown.

version: 2

updates:
  # Next.js app: www/package.json + www/package-lock.json
  - package-ecosystem: npm
    directory: /www
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "deps(www)"
      include: scope
    labels:
      - dependencies
      - npm
    groups:
      tiptap:
        patterns:
          - "@tiptap/*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      next-react:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # @vercel/otel pins the OpenTelemetry SDK, and the SDK pins @opentelemetry/api to a narrow
      # range; moving them separately breaks `npm ci` with ERESOLVE (api 1.10.0, 2026-10-30).
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
          - "@vercel/otel"
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Tracks the Node major in www/.nvmrc and the Dockerfiles; bump those together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # SDK 2.x (required by @vercel/otel 2.x) accepts api <1.10. Remove once @vercel/otel supports
      # the 3.x SDK, then bump @vercel/otel, the SDK packages and the api together.
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      # typescript-eslint (via eslint-config-next) supports TypeScript <6.1 only; 7.0 breaks `npm run lint`
      # (2026-10-30). Remove once typescript-eslint supports TS 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    # www/package.json "overrides" force patched transitive dev packages that their parents still pin
    # (2026-11-09; alerts 1-3): esbuild under drizzle-kit's @esbuild-kit/core-utils (~0.18), postcss-selector-parser
    # under @tailwindcss/typography (6.0.10), minimatch 10 under eslint and typescript-eslint (^10). Drop each
    # override once its parent ships the fix (`npm ls <name>` without the override shows when).

  # Practice executor: executor/pyproject.toml (exact pins, including the [test] extra). Its Dockerfiles are not
  # covered: they use floating python:3.13-slim tags, so the only update would be a Python minor, which is
  # bumped by hand together with the sandbox's PYTHON_VERSION build-arg in ci-practice-executor.yml.
  - package-ecosystem: pip
    directory: /executor
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps(executor)"
    labels:
      - dependencies
      - python
    groups:
      executor-minor-patch:
        update-types:
          - minor
          - patch

  # AWS provider in infra/ (versions.tf) and infra/bootstrap (main.tf), with their .terraform.lock.hcl files.
  # Pull requests get fmt + validate from infra.yml; merging one runs infra.yml's apply job on master.
  - package-ecosystem: terraform
    directories:
      - /infra
      - /infra/bootstrap
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps(terraform)"
    labels:
      - dependencies
      - terraform

  # Base images in www/Dockerfile and www/Dockerfile.ci
  - package-ecosystem: docker
    directory: /www
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: "deps(docker)"
    labels:
      - dependencies
      - docker
    groups:
      node-images:
        patterns:
          - node

  # Images in the Kubernetes manifests (minikube/ is flat, so this covers the site's postgres and redis, the
  # executor's redis and Adminer)
  - package-ecosystem: docker
    directory: /minikube
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: "deps(minikube)"
    labels:
      - dependencies
      - kubernetes
    ignore:
      # Major Postgres upgrades need a dump/restore or pg_upgrade of the data volume.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
      # The app image is built by CI and pinned by ./deploy.sh, not by Dependabot.
      - dependency-name: "*/jithendar-com"

  # Actions in .github/workflows (pinned by commit SHA; Dependabot updates the SHA and the comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: "deps(ci)"
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
