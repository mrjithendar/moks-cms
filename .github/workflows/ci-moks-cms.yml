name: moks-cms

# moks-cms tests its code and pushes the CMS image. It deploys nothing: each website has its own repository (jithendar.com:
# moks-tech/jithendar.com) that ships its site.json, config/, articles and images in a content image, and names the
# CMS image tag it runs in its Kubernetes manifests. The image reads the site's files at run time
# (src/config/site-files.ts), so one image serves any site.
#
# check   → pull requests (opened, updated) and manual runs: lint and typecheck, against the test fixture site
#           (tests/fixtures/site; scripts/use-site.mjs). The production build is the `image` job's.
# test    → the same events, after `check` has passed: the test suite in 2 shards.
# image   → pull requests, after `check` and `test` have passed: the production build packaged as the arm64 image
#           (Dockerfile.ci) and smoke-tested; not pushed.
# release → ONLY when a pull request is merged into the default branch, and only when it changed something that is
#           in the image (job `scope`), or on a manual run (workflow_dispatch) started on the default branch: the
#           same image and smoke test, then push registry.jithendar.com/jithendar/moks-cms:pr-<number>
#           (:manual-<run number> for manual runs) and :latest (the same image). Nothing else: no site is told,
#           each site pulls the image it names.
#           `release` builds only after lint, typecheck and the tests have passed. When `scope` finds that the pull
#           request's head commit passed `check` and every `test` shard in an earlier run, that is enough; a pull
#           request merged while its own run was still going is waited for first. Otherwise (merged while a check was
#           red or cancelled, or a manual run, which has no pull request) `check` and `test` run again on the merge
#           commit, and `release` starts only once they have passed. The workflow has to check this itself: the
#           repository is private on GitHub Free, which has no branch protection or required status checks, so nothing
#           else stops a pull request from being merged before its checks pass.
#
# One stage at a time, from when these jobs ran on the mk4 runner pods: the mk4 workers have 4 cores and 8 GiB each, a runner pod reserves 0.5 core and
# 1 GiB but a test shard or the production build uses 1.5–3 GiB and 2–3 cores. On 2026-11-21 one merge started 7 such
# pods at once (lint, 4 test shards and the release build next to each other); w3 ran out of memory, killed cluster
# components and 5 of the jobs ("The self-hosted runner lost communication"), and the retried shards timed out in
# PGlite set-up. Now a push needs at most 2 runner pods at a time, and a failed lint or typecheck, or a newer push
# (which cancels the run), stops the run before the tests and the build start.
#
# There is deliberately NO `push` trigger: a commit pushed straight to the default branch builds nothing.
#
# Every job runs on GitHub-hosted arm64 runners (runs-on: ubuntu-24.04-arm). The release
# job logs in to Harbor as the robot in repository secrets HARBOR_USERNAME and HARBOR_PASSWORD (push and pull in
# project jithendar only).

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # The app is the repository root: everything except the site template, the runner notes, the Claude skills and
    # the other workflows.
    paths:
      - '**'
      - '!sites/**'
      - '!runner/**'
      - '!.claude/**'
      - '!.github/**'
      - '.github/workflows/ci-moks-cms.yml'

permissions:
  contents: read

# A new push to a pull request cancels the run for the commit it replaces, so the latest commit's checks start at once
# (queued behind an outdated run, they used to be cancelled by the merge and never finish). The run for the merge has a
# group of its own: it never cancels the pull request's last checks, and releases go one at a time through the
# `release` job's group.
concurrency:
  group: moks-cms-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'closed' && '-closed' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  check:
    # Pull requests from forks never run CI here (nothing in it needs them). Branches of this repository,
    # including Dependabot's, still run. On a merge it runs again only when `scope` could not verify the pull
    # request's head commit (then `test` and `release` wait for it).
    needs: scope
    if: >-
      !cancelled() && (github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (needs.scope.outputs.image == 'true' && needs.scope.outputs.verified != 'true'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A merge is checked on its merge commit, the commit `release` builds.
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      # site/, content/ and public/images/ as copies of the test fixture site
      - run: npm run site -- --copy
      - run: npm run lint
      - run: npm run typecheck

  # The release image, built and smoke-tested exactly as `release` does, without pushing it. Last, after lint, typecheck
  # and the tests have passed: the build is the heaviest job (up to ~3 GiB), and a pull request that fails those, or is
  # pushed to again meanwhile, never builds. The result checks are spelled out: `check` needs the skipped `scope`, and a
  # bare condition would skip this job too.
  image:
    needs: [check, test]
    if: >-
      !cancelled() && needs.check.result == 'success' && needs.test.result == 'success' &&
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run site -- --copy
      - run: npm run build
        env:
          APP_ENV: production
      - name: Package image
        run: docker build --platform linux/arm64 --provenance=false -f Dockerfile.ci --build-arg "GIT_SHA=$GITHUB_SHA" -t moks-cms:ci .
      - name: Smoke-test the image
        run: scripts/smoke-site-image.sh moks-cms:ci "$GITHUB_SHA"

  # The test suite split by file over 2 runners, once `check` has passed (so it runs on the same events as `check`,
  # including a merge `scope` could not verify). Each shard runs 2 vitest workers with a PGlite each (vitest.config.ts)
  # and uses ~1.5 GiB and 2+ cores. With 4 shards next to the build and lint, the pods outgrew their worker
  # (see the top of the file); 2 shards do the same work with half the set-up (checkout, npm ci) and half the peak.
  # Keep the shard count in step with TEST_SHARDS in `scope`.
  test:
    needs: [scope, check]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: test (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run site -- --copy
      - run: npm test -- --shard=${{ matrix.shard }}/2

  # Did the merged pull request change anything that is in the image? Notes and READMEs are not (.dockerignore: docs,
  # *.md), so merging only those must not build or push a new image.
  scope:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04-arm
    # Mostly the wait for the pull request's own run (WAIT_MINUTES below).
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      # The steps "Wait for…" and "Did the pull request's head commit pass check and test?" read this workflow's runs
      # and their jobs.
      actions: read
    outputs:
      image: ${{ steps.files.outputs.image }}
      verified: ${{ steps.checks.outputs.verified }}
    steps:
      - name: Files changed by the pull request
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          image=false
          while IFS= read -r f; do
            case "$f" in
              docs/*|*.md|LICENSE|sites/*|runner/*|.claude/*) ;;
              .github/workflows/ci-moks-cms.yml) image=true ;;
              .github/*) ;;
              scripts/build-alerts.py|scripts/check-dashboards.py|scripts/check-conflict-copies.sh) ;;
              *) image=true ;;
            esac
          done < "$RUNNER_TEMP/files.txt"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Pull request #$PR changes the image: $image" >> "$GITHUB_STEP_SUMMARY"
      # A pull request merged while its own run (lint, the tests, the image build) was still going: wait for that run
      # instead of running lint and the tests on the merge commit as well, next to it. The merge has its own
      # concurrency group, so the merge does not cancel that run. It is the whole run, not only `check` and `test`, so
      # the pull request's image build is not running beside the release build either. Never fails the job: after
      # WAIT_MINUTES, or when the runs cannot be listed, the next step decides as usual (and `release` runs lint and
      # the tests itself if nothing passed yet).
      - name: Wait for the pull request's own run to finish
        if: steps.files.outputs.image == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          THIS_RUN: ${{ github.run_id }}
          WAIT_MINUTES: 40
        run: |
          set -uo pipefail
          deadline=$((SECONDS + WAIT_MINUTES * 60))
          last=""
          while :; do
            if ! open="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-moks-cms.yml/runs?head_sha=$HEAD_SHA&per_page=30" \
                  --jq ".workflow_runs[] | select(.id != $THIS_RUN and .status != \"completed\") | .id")"; then
              echo "::warning::The runs for head commit ${HEAD_SHA:0:7} could not be listed; not waiting."
              break
            fi
            open="${open//$'\n'/ }"
            [[ -n "$open" ]] || break
            [[ "$open" == "$last" ]] || echo "Waiting for run $open (head commit ${HEAD_SHA:0:7}) to finish."
            last="$open"
            if ((SECONDS >= deadline)); then
              echo "::warning::Run $open was still not finished after $WAIT_MINUTES minutes; deciding without it."
              break
            fi
            sleep 30
          done
      # `release` skips lint and the tests only when this says "true": the pull request's head commit passed `check`
      # and every `test` shard in an earlier run of this workflow. Nothing else guarantees it (no branch protection
      # on this plan, see the top of the file): a pull request can be merged while a check is red, still running or
      # cancelled. Never fails the job: anything unexpected, including an API error, means "not verified", and
      # `release` then runs lint and the tests itself.
      - name: Did the pull request's head commit pass check and test?
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          THIS_RUN: ${{ github.run_id }}
          # The number of `test` shards. Keep in step with the matrix of the `test` job.
          TEST_SHARDS: 2
        run: |
          set -uo pipefail
          verified=false
          reason="no earlier run of this workflow for the head commit"
          # Runs of this workflow for the head commit, newest first. This run (the `closed` event) has the same head
          # commit and skipped `check` and `test`, so it is left out.
          if ! runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-moks-cms.yml/runs?head_sha=$HEAD_SHA&per_page=30" \
                --jq ".workflow_runs[] | select(.id != $THIS_RUN) | .id")"; then
            runs="" reason="the workflow runs could not be listed"
          fi
          newest=""
          for run in $runs; do
            jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.name == "check" or (.name | startswith("test ("))) | "\(.name)=\(.conclusion)"')" \
              || { [[ -n "$newest" ]] || newest="run $run: its jobs could not be read"; continue; }
            check=false tests=0 other=""
            while IFS= read -r job; do
              case "$job" in
                "") ;;
                "check=success") check=true ;;
                "test ("*"=success") tests=$((tests + 1)) ;;
                *) other="${other:+$other, }$job" ;;
              esac
            done <<<"$jobs"
            if [[ "$check" == true && "$tests" -eq "$TEST_SHARDS" && -z "$other" ]]; then
              verified=true reason="run $run passed check and all $tests test shards"
              break
            fi
            # Reported when no run passed: what the newest run looked like.
            [[ -n "$newest" ]] || newest="run $run: check passed: $check, test shards passed: $tests of $TEST_SHARDS${other:+, not successful: $other}"
          done
          [[ "$verified" == true || -z "$newest" ]] || reason="$newest"
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          if [[ "$verified" == true ]]; then
            echo "Pull request #$PR, head ${HEAD_SHA:0:7}: $reason. The release skips lint and the tests." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Pull request #$PR was merged without passing checks on its head commit ${HEAD_SHA:0:7} ($reason). The release runs lint and the tests itself."
            echo "Pull request #$PR, head ${HEAD_SHA:0:7}: checks not verified ($reason). The release runs lint and the tests itself." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    # Starts after `check` and `test` when they run (a merge `scope` could not verify, or a manual run), and only when
    # both passed; when `scope` verified the head commit they are skipped and this starts at once. scope is skipped on
    # manual runs, so !cancelled() keeps this job from being skipped with it. Manual runs release only from the
    # default branch.
    needs: [scope, check, test]
    if: >-
      !cancelled() && (needs.scope.outputs.image == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)) &&
      (needs.scope.outputs.verified == 'true' || (needs.check.result == 'success' && needs.test.result == 'success'))
    # Native arm64, like the cluster nodes (sharp's prebuilt binaries match the image).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    # Releases go one at a time, in the order the pull requests were merged.
    concurrency:
      group: moks-cms-release
      cancel-in-progress: false
    env:
      REGISTRY_IMAGE: registry.jithendar.com/jithendar/moks-cms
      # Pull requests: pr-<number>. Manual runs: manual-<run number>.
      PR_TAG: ${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_number) || format('pr-{0}', github.event.pull_request.number) }}
      RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit on the default branch, not the pull request's test merge (manual runs: the
          # dispatched commit).
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      # site/, content/ and public/images/ as copies of the test fixture site. The image ships them as defaults, so it
      # starts bare; a site's Deployment mounts its own site/, content/ and public/images/ over them.
      - run: npm run site -- --copy
      # Next's build cache (webpack/turbopack artefacts): an unchanged module is not compiled again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-
      # The production build type-checks the whole project, so no separate typecheck is needed here.
      - run: npm run build
        env:
          APP_ENV: production
      - name: Package image
        run: docker build --platform linux/arm64 --provenance=false -f Dockerfile.ci --build-arg "GIT_SHA=$RELEASE_SHA" -t "$REGISTRY_IMAGE:$PR_TAG" -t "$REGISTRY_IMAGE:latest" .
      # Before the push: a release whose image grew more than 15 % over the stored baseline stops here.
      - name: Image size (summary; fails above +15 % of the stored baseline)
        run: scripts/image-size.sh "$REGISTRY_IMAGE:latest" image-size-baseline.json
      # Never push an image that cannot start or optimise images.
      - name: Smoke-test the image
        run: scripts/smoke-site-image.sh "$REGISTRY_IMAGE:latest" "$RELEASE_SHA"
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$HARBOR_USERNAME" && -n "$HARBOR_PASSWORD" ]] || { echo "::error::Secrets HARBOR_USERNAME and HARBOR_PASSWORD must be set"; exit 1; }
          printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - name: Push
        # Two tags for one image: pr-<number> is this release's own tag, which sites name in their manifests;
        # latest names the newest.
        run: |
          docker push --quiet "$REGISTRY_IMAGE:$PR_TAG"
          docker push --quiet "$REGISTRY_IMAGE:latest"
      - name: Record image
        run: |
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY_IMAGE:latest")"
          {
            echo '### moks-cms image'
            echo
            if [[ "$PR_TAG" == pr-* ]]; then source="pull request #${PR_TAG#pr-}"; else source="manual run #${PR_TAG#manual-}"; fi
            echo "- Tags: \`$REGISTRY_IMAGE:$PR_TAG\` and \`:latest\` ($source, commit \`$RELEASE_SHA\`)"
            echo "- Digest: \`$digest\`"
            echo
            echo "Not deployed: sites name this tag in their own manifests."
          } >> "$GITHUB_STEP_SUMMARY"
