name: practice-executor

# check   → pull requests and pushes touching the executor or the practice catalog: executor tests, then the
#           catalog build check (runs every reference solution through the sandbox runner and verifies the
#           committed catalog.generated.json is up to date)
# release → a merged pull request: build the arm64 images and push them to Harbor as
#           registry.jithendar.com/jithendar/practice-executor and practice-sandbox, each as :pr-<number> and :latest
#           Then, when repository variable RELEASE_NOTIFY_REPOS lists site repositories, each gets a repository_dispatch
#           "moks-cms-released" {component: practice-executor, tag} (scripts/notify-sites.sh).
# Nothing here deploys: the manifests (namespaces, RuntimeClass, admission policy, RBAC) and the rollout live in each
# site's repository (jithendar.com: mrjithendar/jithendar.com, kubernetes/practice-executor-*.yaml). The catalog checked
# here is the test fixture site's (build_problems.py; SITE_DIR=<site checkout> checks another).
#
# Registry: the release job logs in to Harbor with repository secrets HARBOR_USERNAME and HARBOR_PASSWORD.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'services/executor/**'
      - 'services/www/tests/fixtures/site/content/python-practice/**'
      - '.github/workflows/ci-practice-executor.yml'

permissions:
  contents: read

concurrency:
  group: practice-executor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.action != 'closed' || github.event.pull_request.merged == true))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A merged pull request is built from its merge commit on the default branch.
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || '' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        working-directory: services/executor
        run: pip install --quiet ".[test]" pyyaml==6.0.3
      - name: Executor tests
        working-directory: services/executor
        run: python -m pytest -q
      - name: Catalog is valid and up to date
        run: |
          python services/executor/tools/build_problems.py
          git diff --exit-code -- services/www/tests/fixtures/site/content/python-practice/catalog.generated.json || {
            echo "::error::catalog.generated.json is stale: run python services/executor/tools/build_problems.py and commit it"; exit 1; }

  release:
    needs: check
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: practice-executor-release
      cancel-in-progress: false
    env:
      REGISTRY: registry.jithendar.com/jithendar
      PR_TAG: pr-${{ github.event.pull_request.number }}
      RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A merged pull request is built from its merge commit on the default branch.
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || '' }}
      # Harbor robot robot$jithendar+jithendar-com (push and pull in project jithendar only), set as these
      # repository secrets by the tools repository's deploy/minikube/harbor/registry.py ci-robots.
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - name: Build and push
        id: push
        working-directory: services/executor
        # Two tags for one image: pr-<number> is this release's own tag and what the Deployments will run; latest
        # names the newest release (sandbox pods use it). A re-run builds and pushes again.
        run: |
          set -euo pipefail
          docker build --platform linux/arm64 --provenance=false -t "$REGISTRY/practice-executor:latest" .
          docker build --platform linux/arm64 --provenance=false --build-arg PYTHON_VERSION=3.13 -t "$REGISTRY/practice-sandbox:latest" sandbox
          # Smoke test the sandbox image: run one job through the real runner, offline.
          payload=$(python3 -c 'import base64,json; print(base64.b64encode(json.dumps({"nonce":"n","code":"def f(a):\n    return a*2\n","entrypoint":"f","tests":[{"id":"t0","args":[21]}],"limits":{"per_test_seconds":2,"total_seconds":5,"memory_mb":128,"output_bytes":1024}}).encode()).decode())')
          docker run --rm --network none --read-only --tmpfs /tmp -e JOB_PAYLOAD="$payload" "$REGISTRY/practice-sandbox:latest" | grep -q '"output": 42'
          for image in practice-sandbox practice-executor; do
            docker tag "$REGISTRY/$image:latest" "$REGISTRY/$image:$PR_TAG"
            docker push --quiet "$REGISTRY/$image:$PR_TAG"
            docker push --quiet "$REGISTRY/$image:latest"
          done
          {
            echo "- $REGISTRY/practice-executor:latest ($(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/practice-executor:latest"))"
            echo "- $REGISTRY/practice-sandbox:latest ($(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/practice-sandbox:latest"))"
            echo "- also tagged $PR_TAG; commit $RELEASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tell the site repositories
        env:
          REPOS: ${{ vars.RELEASE_NOTIFY_REPOS }}
          GH_TOKEN: ${{ secrets.RELEASE_NOTIFY_TOKEN }}
        run: scripts/notify-sites.sh practice-executor "$PR_TAG" "$RELEASE_SHA"
