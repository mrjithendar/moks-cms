name: RAG eval (manual)

# The real retrieval evaluation (moks-cms docs/seo/RAG.md "Evaluation"): the eval set in
# app/data/rag_eval.yaml against the blog's MDX files (tests/fixtures/rag_corpus), with the production embedding model
# (bge-small-en-v1.5 ONNX at the image's pinned revision and checksums) and Postgres full-text search (pgvector
# service; the vector list is exact cosine in numpy). Run it after changing the chunker, retrieval or the eval set.
# The reports are written to the job summary; commit the ones worth keeping under moks-cms docs/seo/rag-eval/.

on:
  workflow_dispatch:
    inputs:
      configs:
        description: Configurations (scripts/rag_eval.py)
        default: baseline-v4,token-vector,token-vector-div,token-hybrid-noid,token-hybrid
      extra_args:
        description: Extra arguments, e.g. --max-per-article 2 --suffix=.div2
        default: ""

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: rag_eval
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install uv (pinned)
        run: pip install --quiet "uv==0.13.5"
      - name: Install locked dependencies
        run: uv sync --frozen --python python3.13
      - name: Fetch the embedding model (same revision and checksums as the Dockerfile)
        run: |
          set -euo pipefail
          rev="$(sed -n 's/^ARG MODEL_REV=//p' Dockerfile)"
          msha="$(sed -n 's/^ARG MODEL_SHA256=//p' Dockerfile)"
          tsha="$(sed -n 's/^ARG TOKENIZER_SHA256=//p' Dockerfile)"
          mkdir -p "$RUNNER_TEMP/bge"
          curl -fsSL -o "$RUNNER_TEMP/bge/model.onnx" "https://huggingface.co/BAAI/bge-small-en-v1.5/resolve/$rev/onnx/model.onnx"
          curl -fsSL -o "$RUNNER_TEMP/bge/tokenizer.json" "https://huggingface.co/BAAI/bge-small-en-v1.5/resolve/$rev/tokenizer.json"
          echo "$msha  $RUNNER_TEMP/bge/model.onnx" | sha256sum -c -
          echo "$tsha  $RUNNER_TEMP/bge/tokenizer.json" | sha256sum -c -
      - name: Evaluate
        env:
          CONFIGS: ${{ inputs.configs }}
          EXTRA: ${{ inputs.extra_args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          uv run --frozen python scripts/rag_eval.py --embeddings onnx --model-dir "$RUNNER_TEMP/bge" \
            --dsn postgresql://postgres:ci-only-not-secret@localhost:5432/rag_eval --configs "$CONFIGS" --out "$RUNNER_TEMP/rag-eval" $EXTRA
          # Every report goes into the job summary (copy the ones worth keeping into moks-cms docs/seo/rag-eval/).
          cat "$RUNNER_TEMP"/rag-eval/*summary*.md "$RUNNER_TEMP"/rag-eval/*[!y].md >> "$GITHUB_STEP_SUMMARY"
