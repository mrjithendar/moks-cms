name: jithendar.com

# check   → pull requests (opened, updated) and manual runs: lint, typecheck, test, build, render manifests
# release → also on a manual run (workflow_dispatch) started on the default branch: same build, test, smoke test
#           and push as below, tagged :manual-<run number> and :latest; the rollout is on by default and can be
#           switched off with the `restart` input
# release → ONLY when a pull request is merged into the default branch, and only when it changed something that is
#           in the image (job `scope`): npm ci once; lint, tests and the production build (in turn); package the
#           build into an arm64 image, smoke-test the image, push it to Harbor as
#           registry.jithendar.com/jithendar/moks-cms:pr-<number> (the pull request's own tag) and :latest
#           (the same image), then point every Deployment that runs this image at :pr-<number> and wait for it
#           (scripts/ci-rollout.py)
#
# There is deliberately NO `push` trigger: a commit pushed straight to the default branch builds and deploys
# nothing. Roll back with `kubectl -n jithendar set image deploy/jithendar-com web=…/moks-cms:pr-<n>`;
# it stays until the next release (deploy-minikube.yml keeps the image a workload is running).
#
# CI's only cluster access here is that rollout (kubeconfig template .github/jithendar-ci-deployer.yaml, filled
# from variables MK4_API_SERVER, MK4_CA_DATA and secret MK4_CI_TOKEN set by scripts/setup-ci-deployer.sh); it
# never applies manifests. deploy-minikube.yml applies minikube/ for manifest changes (see minikube/README.md). The site
# runs the tag of its last release, which `kubectl -n jithendar get deploy -o wide` shows. The manifests name :latest
# only for a first apply; :latest is still pushed with every release and names the newest image.
#
# Both jobs run on GitHub-hosted runners, never on the mk4 server: builds there competed with the cluster
# for memory and disk and froze the host (2026-10-29). The release job logs in to Harbor as robot
# robot$jithendar+jithendar-com (repository secrets HARBOR_USERNAME and HARBOR_PASSWORD, set by the tools
# repository's deploy/minikube/harbor/registry.py ci-robots; push and pull in project jithendar only).

on:
  workflow_dispatch:
    inputs:
      restart:
        description: Roll the site out on the image this run pushes
        type: boolean
        default: true
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'services/www/**'
      # Content and images ship in their own image (ci-content.yml); they never rebuild this one.
      - '!services/www/Dockerfile.content*'
      # A site's identity and config are compiled into the app; its content and images are not (sites/<domain>/).
      - 'sites/*/site.json'
      - 'sites/*/config/**'
      - 'minikube/**'
      - '.github/workflows/ci-jithendar-com.yml'
      - 'scripts/image-size.sh'

permissions:
  contents: read

# Runs for the same pull request go one at a time.
concurrency:
  group: jithendar-com-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/www

jobs:
  check:
    # Pull requests from forks never run CI here (nothing in it needs them). Branches of this repository,
    # including Dependabot's, still run.
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Measured on 2026-11-14 over 17 runs: 8 to 14.7 minutes, of which the tests take about 11. At 15 a run was
    # cancelled seconds before its build finished, with lint, typecheck and all tests green.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/www/.nvmrc
          cache: npm
          cache-dependency-path: services/www/package-lock.json
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0
      - run: npm ci --no-audit --no-fund
      # site/, content/ and public/images/ as copies of sites/jithendar.com (the image and output tracing need real files)
      - run: npm run site -- --copy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          APP_ENV: production
      - name: Render production manifests
        run: kubectl kustomize ../../minikube > /dev/null

  # Did the merged pull request change anything that is in the image? Notes, article diagram sources, READMEs and
  # manifests are not (.dockerignore: docs, *.md), so merging only those must not rebuild or restart the site.
  scope:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ steps.files.outputs.image }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Files changed by the pull request
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          image=false
          while IFS= read -r f; do
            case "$f" in
              services/www/Dockerfile.content*|services/www/docs/*) ;;
              services/www/*.md) ;;
              services/www/*|sites/*/site.json|sites/*/config/*|.github/workflows/ci-jithendar-com.yml|scripts/image-size.sh) image=true ;;
            esac
          done < "$RUNNER_TEMP/files.txt"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Pull request #$PR changes the image: $image" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: scope
    # scope is skipped on manual runs, so !cancelled() keeps this job from being skipped with it. Manual runs
    # release only from the default branch: what they push is rolled out.
    if: >-
      !cancelled() && (needs.scope.outputs.image == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch))
    # Native arm64, like the cluster nodes (sharp's prebuilt binaries match the image).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    # Releases go one at a time, in the order the pull requests were merged.
    concurrency:
      group: jithendar-com-release
      cancel-in-progress: false
    env:
      REGISTRY_IMAGE: registry.jithendar.com/jithendar/moks-cms
      # Pull requests: pr-<number>. Manual runs: manual-<run number>.
      PR_TAG: ${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_number) || format('pr-{0}', github.event.pull_request.number) }}
      RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit on the default branch, not the pull request's test merge (manual runs: the
          # dispatched commit).
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/www/.nvmrc
          cache: npm
          cache-dependency-path: services/www/package-lock.json
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0
      - run: npm ci --no-audit --no-fund
      # site/, content/ and public/images/ as copies of sites/jithendar.com (the image and output tracing need real files)
      - run: npm run site -- --copy
      # One step each, in sequence: output streams live and a failure names its step. (Running them in parallel
      # only paid off on the shared self-hosted server; on a fresh VM it just stacks three memory peaks.)
      - run: npm run lint
      # Tests rely on development fallbacks (e.g. SETTINGS_ENCRYPTION_KEY); only the build is production.
      - run: npm test
      # The production build type-checks the whole project, so no separate typecheck is needed here.
      - run: npm run build
        env:
          APP_ENV: production
      # cancelled() too: a step ended by "The operation was canceled" does not count as failure().
      - name: Diagnostics (only when a step above failed or was canceled)
        if: failure() || cancelled()
        run: |
          free -m || true
          sudo dmesg --ctime 2>/dev/null | grep -iE "oom|killed process|out of memory" | tail -20 || true
          journalctl --no-pager -u systemd-oomd --since "-30 min" 2>/dev/null | tail -20 || true
      - name: Render production manifests
        run: kubectl kustomize ../../minikube > /dev/null
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$HARBOR_USERNAME" && -n "$HARBOR_PASSWORD" ]] || { echo "::error::Secrets HARBOR_USERNAME and HARBOR_PASSWORD must be set"; exit 1; }
          printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - name: Package image
        run: docker build --platform linux/arm64 --provenance=false -f Dockerfile.ci --build-arg "GIT_SHA=$RELEASE_SHA" -t "$REGISTRY_IMAGE:$PR_TAG" -t "$REGISTRY_IMAGE:latest" .
      # Before the push: a release whose image grew more than 15 % over the stored baseline stops here.
      - name: Image size (summary; fails above +15 % of the stored baseline)
        run: ../../scripts/image-size.sh "$REGISTRY_IMAGE:latest" image-size-baseline.json
      # Never push an image that cannot start or optimise images.
      - name: Smoke-test the image
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}:latest
        run: |
          set -euo pipefail
          name="jithendar-smoke-$GITHUB_RUN_ID"
          # The image defaults to APP_ENV=production (Dockerfile.ci), which expects the cluster's secrets. This check
          # starts it bare, as it always has, so it has to say that it is not the production site.
          docker run -d --rm --name "$name" -e APP_ENV=development -p 127.0.0.1::3000 "$IMAGE" >/dev/null
          trap 'docker logs "$name" | tail -50; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "$name" 3000/tcp | head -1 | sed 's/.*://')"
          for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:$port/api/health" >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS "http://127.0.0.1:$port/api/health" | grep -q "\"version\":\"$RELEASE_SHA\""
          type="$(curl -fsS -o /dev/null -w '%{content_type}' -H 'Accept: image/avif,image/webp' \
            "http://127.0.0.1:$port/_next/image?url=%2Fimages%2Froboshop-ai%2Fcart.jpg&w=640&q=75")"
          [[ "$type" == image/avif* || "$type" == image/webp* ]] || { echo "Image optimiser returned: $type" >&2; exit 1; }
          echo "Image healthy; optimiser served $type"
      - name: Push
        # Two tags for one image: pr-<number> is this release's own tag and what the cluster will run; latest
        # names the newest release. The commit is inside the image (/api/health reports it).
        run: |
          docker push --quiet "$REGISTRY_IMAGE:$PR_TAG"
          docker push --quiet "$REGISTRY_IMAGE:latest"
      # Every Deployment that runs this image is pointed at the tag just pushed and waited for; one that is already
      # on it (this job was run again) is restarted so that it pulls the image again (scripts/ci-rollout.py).
      # Signs in as ServiceAccount jithendar/github-ci-deployer, which may only read and patch the Deployments named
      # in minikube/80-ci-deployer.yaml: the template .github/jithendar-ci-deployer.yaml filled in with the values
      # that scripts/setup-ci-deployer.sh stored.
      - name: Roll out jithendar-com
        if: github.event_name != 'workflow_dispatch' || inputs.restart
        env:
          MK4_API_SERVER: ${{ vars.MK4_API_SERVER }}
          MK4_CA_DATA: ${{ vars.MK4_CA_DATA }}
          MK4_CI_TOKEN: ${{ secrets.MK4_CI_TOKEN }}
        run: |
          set -euo pipefail
          for v in MK4_API_SERVER MK4_CA_DATA MK4_CI_TOKEN; do
            [[ -n "${!v}" ]] || { echo "::error::$v is not set; run scripts/setup-ci-deployer.sh"; exit 1; }
          done
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          (umask 077; perl -pe 's/\$\{(MK4_[A-Z_]+)\}/$ENV{$1}/g' ../../.github/jithendar-ci-deployer.yaml > "$KUBECONFIG")
          # The image was called jithendar-com until the repository became moks-cms (2026-11-14): --previous moves a
          # Deployment that still runs the old name onto this release.
          python3 ../../scripts/ci-rollout.py "$REGISTRY_IMAGE" "$PR_TAG" --previous registry.jithendar.com/jithendar/jithendar-com
      - name: Record image
        env:
          RESTARTED: ${{ github.event_name != 'workflow_dispatch' || inputs.restart }}
        run: |
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY_IMAGE:latest")"
          {
            echo '### moks-cms image (jithendar.com site)'
            echo
            if [[ "$PR_TAG" == pr-* ]]; then source="pull request #${PR_TAG#pr-}"; else source="manual run #${PR_TAG#manual-}"; fi
            echo "- Tags: \`$REGISTRY_IMAGE:$PR_TAG\` and \`:latest\` ($source, commit \`$RELEASE_SHA\`)"
            echo "- Digest: \`$digest\`"
            echo
            if [[ "$RESTARTED" == true ]]; then
              echo "Deployed as \`:$PR_TAG\` (see the rollout above)"
            else
              echo "Not deployed: the rollout was switched off; the cluster keeps the image it runs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
