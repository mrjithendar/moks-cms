name: seo-agent contract

# The SEO agent (moks-tech/moks-seo-agent) reads and writes this app's database and calls its callback API. Its contract
# tests read files here: the migrations and rollbacks, the callback server's route table
# (src/lib/seo-agent/internal-server.ts), and constants both sides keep equal (src/lib/seo-agent/config.ts and
# skills.ts, src/lib/seo-intel/keywords.ts, the news job-config fixture). A pull request that changes one of them runs
# the agent's whole test suite (its master branch) against this pull request's files, with a pgvector PostgreSQL, so a
# change here that would break the agent fails here and not in production. The agent's own CI runs the same tests
# against moks-cms master.
# Pull requests only: there is no `push` trigger, and nothing is built, pushed or deployed.
#
# Secret CROSS_REPO_READ_TOKEN: a fine-grained token with Contents: read on moks-tech/moks-seo-agent (the repository is
# private). Dependabot's pull requests read Dependabot secrets, so it is needed there too.

on:
  pull_request:
    paths:
      - 'src/db/migrations/**'
      - 'src/db/rollback/**'
      - 'src/lib/seo-agent/**'
      - 'src/lib/seo-intel/keywords.ts'
      - 'src/lib/news/schema.ts'
      - 'docs/news/fixtures/**'
      - '.github/workflows/agent-contract.yml'

permissions:
  contents: read

concurrency:
  group: agent-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The image the agent's CI tests against (PostgreSQL 18, as in the cluster).
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: seo_agent_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SEO_AGENT_TEST_DATABASE_URL: postgresql://postgres:ci-only-not-secret@localhost:5432/seo_agent_test
      UV_PYTHON_DOWNLOADS: never
      # The agent's tests/moks_cms.py reads this checkout (a wrong path fails, never skips).
      MOKS_CMS_DIR: ${{ github.workspace }}
    defaults:
      run:
        working-directory: .moks-seo-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Secret CROSS_REPO_READ_TOKEN is set
        working-directory: .
        env:
          TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
        run: |
          [[ -n "$TOKEN" ]] || { echo "::error::Secret CROSS_REPO_READ_TOKEN (Contents: read on moks-tech/moks-seo-agent) is not set."; exit 1; }
      - name: Check out the seo-agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moks-tech/moks-seo-agent
          path: .moks-seo-agent
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install uv (pinned)
        run: pip install --quiet "uv==0.13.5"
      - name: Install the agent's locked dependencies
        run: uv sync --frozen --python python3.13
      - name: The agent's tests against this pull request
        run: uv run --frozen pytest -q -rs
