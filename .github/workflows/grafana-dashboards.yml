name: grafana dashboards

# check → pull requests touching a site's dashboards (and manual runs; there is no `push` trigger). Every site has its own
#         folder, sites/<domain>/grafana/, and its own ConfigMap. The dashboards are valid JSON, listed in their folder's
#         kustomization.yaml, use only provisioned data sources and defined variables, and uids and ConfigMap names are
#         unique across sites (scripts/check-dashboards.py); each folder renders as exactly one ConfigMap.
#
# No deploy job: one Argo CD Application per site (tools repo; jithendar.com's is `grafana`) reads
# sites/<domain>/grafana/ from master and is synced by a person.
# This workflow has no cluster access.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sites/*/grafana/**'
      - 'scripts/check-dashboards.py'
      - '.github/workflows/grafana-dashboards.yml'

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check dashboards
        run: python scripts/check-dashboards.py
      - name: Render each site's ConfigMap
        run: |
          set -euo pipefail
          for k in sites/*/grafana/kustomization.yaml; do
            dir="${k%/kustomization.yaml}"; site="${dir#sites/}"; site="${site%/grafana}"
            [[ "$site" == _* ]] && continue
            out="$RUNNER_TEMP/$site.yaml"
            kubectl kustomize "$dir" > "$out"
            [[ "$(grep -c '^kind: ConfigMap$' "$out")" -eq 1 ]] || { echo "::error::$dir must render exactly one ConfigMap"; exit 1; }
            size="$(wc -c < "$out")"
            echo "$site: $(grep -m1 '^  name: ' "$out" | sed 's/^  name: //'), $size bytes (limit 1 MiB)"
            [[ "$size" -lt 1048576 ]] || { echo "::error::$site's dashboards exceed the 1 MiB ConfigMap limit"; exit 1; }
          done
