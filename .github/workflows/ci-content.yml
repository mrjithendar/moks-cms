name: wwww-content

# Content-only releases: no lint, no typecheck, no Next.js build.
#
# check   → pull requests touching content: validate content/ (frontmatter schema, internal links)
# release → default branch: validate, package services/www/content and services/www/public/images into a tiny busybox image,
#           push registry.jithendar.com/jithendar/jithendar-content:latest to Harbor, then
#           `kubectl rollout restart deploy/jithendar-com` so the init container "content" copies the new files
#           into the pods (minikube/30-jithendar-com.yaml).
#
# ci-jithendar-com.yml ignores these paths, so writing a post never rebuilds the jithendar-com image.
# Uses the same Harbor robot (HARBOR_USERNAME/HARBOR_PASSWORD, project jithendar) and the same cluster
# access (github-ci-deployer, which may restart deploy/jithendar-com) as ci-jithendar-com.yml.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/www/content/**'
      - 'services/www/public/images/**'
      - 'services/www/Dockerfile.content'
      - 'services/www/Dockerfile.content.dockerignore'
      - '.github/workflows/ci-content.yml'
  push:
    paths:
      - 'services/www/content/**'
      - 'services/www/public/images/**'
      - 'services/www/Dockerfile.content'
      - 'services/www/Dockerfile.content.dockerignore'
      - '.github/workflows/ci-content.yml'

permissions:
  contents: read

concurrency:
  group: jithendar-content-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/www

jobs:
  check:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/www/.nvmrc
          cache: npm
          cache-dependency-path: services/www/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate content
        run: npx vitest run tests/content.test.ts tests/links.test.ts

  release:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      REGISTRY_IMAGE: registry.jithendar.com/jithendar/jithendar-content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/www/.nvmrc
          cache: npm
          cache-dependency-path: services/www/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate content
        run: npx vitest run tests/content.test.ts tests/links.test.ts
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$HARBOR_USERNAME" && -n "$HARBOR_PASSWORD" ]] || { echo "::error::Secrets HARBOR_USERNAME and HARBOR_PASSWORD must be set"; exit 1; }
          printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - name: Package image
        run: |
          docker build --platform linux/arm64 --provenance=false -f Dockerfile.content \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$REGISTRY_IMAGE:latest" .
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          out="$(mktemp -d)"; mkdir -p "$out/content" "$out/images"; chmod 777 "$out/content" "$out/images"
          docker run --rm -v "$out/content:/mnt/content" -v "$out/images:/mnt/images" "$REGISTRY_IMAGE:latest"
          test -d "$out/content/blog" && test -d "$out/content/authors"
          [[ "$(find "$out/content" -name '*.mdx' | wc -l)" -eq "$(find content -name '*.mdx' | wc -l)" ]]
          [[ "$(find "$out/images" -type f | wc -l)" -eq "$(find public/images -type f | wc -l)" ]]
          echo "Copied $(find "$out/content" -name '*.mdx' | wc -l) MDX files and $(find "$out/images" -type f | wc -l) images"
      - name: Push
        run: docker push --quiet "$REGISTRY_IMAGE:latest"
      # The init container pulls jithendar-content:latest (imagePullPolicy Always) whenever a pod starts.
      - name: Restart jithendar-com
        env:
          MK4_API_SERVER: ${{ vars.MK4_API_SERVER }}
          MK4_CA_DATA: ${{ vars.MK4_CA_DATA }}
          MK4_CI_TOKEN: ${{ secrets.MK4_CI_TOKEN }}
        run: |
          set -euo pipefail
          for v in MK4_API_SERVER MK4_CA_DATA MK4_CI_TOKEN; do
            [[ -n "${!v}" ]] || { echo "::error::$v is not set; run scripts/setup-ci-deployer.sh"; exit 1; }
          done
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          (umask 077; perl -pe 's/\$\{(MK4_[A-Z_]+)\}/$ENV{$1}/g' ../../.github/jithendar-ci-deployer.yaml > "$KUBECONFIG")
          kubectl -n jithendar rollout restart deploy/jithendar-com
          if ! kubectl -n jithendar rollout status deploy/jithendar-com --timeout=5m; then
            echo "::error::Rollout of jithendar-com did not finish within 5 minutes"
            exit 1
          fi
      - name: Record image
        run: |
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY_IMAGE:latest")"
          {
            echo '### jithendar.com content image'
            echo
            echo "- Tag: \`$REGISTRY_IMAGE:latest\` (commit \`$GITHUB_SHA\`)"
            echo "- Digest: \`$digest\`"
            echo
            echo "Deployed: deploy/jithendar-com restarted; init container copied the new content"
          } >> "$GITHUB_STEP_SUMMARY"
