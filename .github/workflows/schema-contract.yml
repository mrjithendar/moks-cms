name: schema-contract

# The SEO agent reads and writes the web app's database, and its Postgres tests declare the tables they touch by hand.
# check → pull requests that change a web app migration or the agent's tests: every migration is applied to a real
#         PostgreSQL and the hand-written tables must still match it
#         (services/seo-agent/tests/test_schema_contract.py).
# The agent's own workflow (ci-seo-agent.yml) runs the same test with the rest of its suite, but a change under
# services/www does not trigger it; this one does, without building or releasing the agent.
# Pull requests only: there is no `push` trigger, and nothing is built, pushed or deployed.

on:
  pull_request:
    paths:
      - 'services/www/src/db/migrations/**'
      - 'services/seo-agent/tests/**'
      - '.github/workflows/schema-contract.yml'

permissions:
  contents: read

concurrency:
  group: schema-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # The image ci-seo-agent.yml tests against (PostgreSQL 18, as in the cluster).
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: seo_agent_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SEO_AGENT_TEST_DATABASE_URL: postgresql://postgres:ci-only-not-secret@localhost:5432/seo_agent_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install what this one test needs
        # The same versions as services/seo-agent/pyproject.toml; the agent's full environment (CrewAI, ONNX, …) is
        # not needed to compare two schemas.
        run: pip install --quiet "psycopg[binary]==3.3.6" "pytest==9.1.1" "pytest-asyncio==1.4.1"
      - name: Hand-written test tables match the migrations
        working-directory: services/seo-agent
        # --noconftest: tests/conftest.py imports the whole agent.
        run: python -m pytest -q -rs --noconftest tests/test_schema_contract.py
