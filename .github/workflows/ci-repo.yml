name: repository checks

# Cheap checks that concern the whole repository, on every pull request (and manual runs; there is no `push` trigger):
# - no cloud-sync conflict copies are tracked ("README 2.md", "ScrollSpy (1).tsx"): scripts/check-conflict-copies.sh
# - shellcheck of the image and release scripts
# - the alerts handoff file (scripts/build-alerts.py)
# The cluster scripts (kube-context guard, rollout, deploy and config scripts) and their tests moved with the site to
# moks-tech/jithendar.com on 2026-11-16.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: mk4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No cloud-sync conflict copies
        run: scripts/check-conflict-copies.sh
      - name: shellcheck
        # Needs shellcheck on the runner (ubuntu-latest shipped it; the mk4 runner image does not).
        # verify-practice-sandbox.sh is excluded: it builds eval'd check strings on purpose.
        run: shellcheck -x scripts/check-conflict-copies.sh scripts/image-size.sh scripts/smoke-site-image.sh scripts/wait-for-jobs.sh
      - name: Alerts handoff file is current and valid
        # Structural checks + staleness (scripts/build-alerts.py --check), then full PromQL validation with promtool
        # from the pinned Prometheus image (the same major version as the cluster's).
        run: |
          set -euo pipefail
          pip install --quiet pyyaml==6.0.3
          python3 scripts/build-alerts.py --check
          docker run --rm --entrypoint promtool -v "$PWD/docs:/docs:ro" prom/prometheus:v3.5.0 \
            check rules /docs/seo/alerts-for-minikube-repo.yaml
