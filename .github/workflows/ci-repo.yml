name: repository checks

# Cheap checks that concern the whole repository, on every pull request (and manual runs; there is no `push` trigger):
# - no cloud-sync conflict copies are tracked ("README 2.md", "ScrollSpy (1).tsx"): scripts/check-conflict-copies.sh
# - the kube-context guard every cluster script sources (scripts/lib/kube-context.sh), tested with a stub kubectl
# - the scripts the release and deploy jobs run (scripts/ci-rollout.py, scripts/keep-live-images.py), tested the same
#   way: those jobs only run after a merge, so this is where a mistake in them is caught first
# - shellcheck of the guard, its test and the deploy/config scripts

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No cloud-sync conflict copies
        run: scripts/check-conflict-copies.sh
      - name: Kube-context guard (stub kubectl)
        run: bash scripts/tests/kube-context.test.sh
      - name: Release and deploy scripts (stub kubectl)
        run: |
          pip install --quiet pyyaml==6.0.3
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: shellcheck
        # ubuntu-latest ships shellcheck. verify-practice-sandbox.sh is excluded: it builds eval'd check strings on purpose.
        run: shellcheck -x scripts/lib/kube-context.sh scripts/tests/kube-context.test.sh scripts/check-conflict-copies.sh scripts/image-size.sh scripts/create-*.sh scripts/set-*.sh scripts/setup-ci-applier.sh scripts/setup-ci-deployer.sh
      - name: Alerts handoff file is current and valid
        # Structural checks + staleness (scripts/build-alerts.py --check), then full PromQL validation with promtool
        # from the pinned Prometheus image (the same major version as the cluster's).
        run: |
          set -euo pipefail
          pip install --quiet pyyaml==6.0.3
          python3 scripts/build-alerts.py --check
          docker run --rm --entrypoint promtool -v "$PWD/services/www/docs:/docs:ro" prom/prometheus:v3.5.0 \
            check rules /docs/seo/alerts-for-minikube-repo.yaml
