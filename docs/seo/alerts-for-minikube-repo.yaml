# GENERATED by scripts/build-alerts.py from docs/seo/prometheus-alerts.yml,
# docs/news/prometheus-alerts.yml and docs/cache-bus/prometheus-alerts.yml.
# Do not edit by hand: edit a source, then run the script.
#
# Handoff to the miniKube repository (this repository never applies alert rules, decision D-12):
#   1. In the miniKube repo, open deploy/minikube/observability/prometheus/files/alerts.yml.
#   2. Replace the groups named below (or append them the first time) with the groups in this file.
#   3. `promtool check rules alerts.yml` there, commit, and let its Prometheus reload.
#
# Groups: jithendar-com-seo, jithendar-com-seo-agent, jithendar-com-seo-ml, jithendar-com-news, jithendar-com-cache-bus
groups:
- name: jithendar-com-seo
  rules:
  - alert: SeoSyncConsecutiveFailures
    expr: max by (job_type) (seo_sync_consecutive_failures{job="jithendar-com", job_type=~"gsc_sync|ga4_sync"}) >= 3
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: SEO {{ $labels.job_type }} has failed {{ $value }} times in a row
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/seo/OPERATIONS.md#sync-failures
  - alert: SeoGoogleAuthError
    expr: sum by (job_type) (increase(seo_sync_failure_total{job="jithendar-com", error_code="auth"}[2h])) > 0
    labels:
      severity: warning
    annotations:
      summary: Google denied access during SEO {{ $labels.job_type }} (credentials or property permissions)
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/seo/OPERATIONS.md#auth-errors
  - alert: SeoGoogleApiErrorsPersistent
    expr: '(sum by (provider) (increase(seo_api_errors_total{job="jithendar-com"}[6h])) >= 10)

      and

      (sum by (provider) (increase(seo_api_errors_total{job="jithendar-com"}[6h])) / sum by (provider) (increase(seo_api_requests_total{job="jithendar-com"}[6h])) > 0.5)

      '
    labels:
      severity: warning
    annotations:
      summary: More than half of {{ $labels.provider }} API requests failed in the last 6 hours
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/seo/OPERATIONS.md#api-errors
  - alert: SeoDataStale
    expr: (time() - max(seo_sync_last_success_timestamp_seconds{job="jithendar-com", job_type="gsc_sync"})) > 3 * 86400 and max(seo_sync_last_success_timestamp_seconds{job="jithendar-com", job_type="gsc_sync"})
      > 0
    for: 1h
    labels:
      severity: info
    annotations:
      summary: No successful Search Console sync for more than 3 days
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/seo/OPERATIONS.md#sync-failures
- name: jithendar-com-seo-agent
  rules:
  - alert: SeoAgentDown
    expr: absent(up{job="seo-agent"} == 1)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: 'The seo-agent service is down or not scraped: no CrewAI flow runs (SEO_ORCHESTRATOR=crewai), MCP is unavailable; legacy path unaffected'
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/seo/FLOWS.md#operations
  - alert: SeoFlowRepeatedFailures
    expr: sum by (flow) (increase(seo_flow_runs_total{job="seo-agent", status="failed"}[6h])) >= 3
    labels:
      severity: warning
    annotations:
      summary: '{{ $value }} {{ $labels.flow }} runs failed in 6 hours'
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/seo/FLOWS.md#failed-runs
  - alert: SeoFlowStale
    expr: '(time() - max by (flow) (seo_flow_last_success_timestamp_seconds{job="seo-agent", flow=~"gsc_sync_flow|ga4_sync_flow"})) > 2 * 86400

      or

      (time() - max by (flow) (seo_flow_last_success_timestamp_seconds{job="seo-agent", flow=~"tech_audit_flow|weekly_recommendations_flow|internal_linking_flow|reindex_flow|ask_gaps_flow|report_flow"}))
      > 14 * 86400

      '
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.flow }} has not succeeded within twice its schedule (check its CronJob seo-flow-* and the run errors)'
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/seo/FLOWS.md#scheduling
  - alert: SeoMcpAuthFailureSpike
    expr: sum by (server) (increase(seo_mcp_auth_failures_total{job="seo-agent"}[15m])) > 30
    labels:
      severity: warning
    annotations:
      summary: '{{ $value }} rejected MCP bearer tokens in 15 minutes on /mcp/{{ $labels.server }} (token guessing or a broken client; kill switch ADMIN_MCP_ENABLED=false)'
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/seo/MCP.md#operations
  - alert: SeoLlmBudget80
    expr: max(seo_llm_budget_used_ratio{job="seo-agent"}) >= 0.8 and max(seo_llm_budget_used_ratio{job="seo-agent"}) < 1
    for: 15m
    labels:
      severity: info
    annotations:
      summary: SEO LLM spend is at {{ $value | humanizePercentage }} of the monthly budget (v2 and the v4 flows share it)
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/seo/COSTS.md#budget-controls
  - alert: SeoLlmBudgetReached
    expr: max(seo_llm_budget_used_ratio{job="seo-agent"}) >= 1
    labels:
      severity: warning
    annotations:
      summary: 'SEO LLM monthly budget reached: new drafting/report flow runs pause (paused_budget) until next month or a higher cap'
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/seo/COSTS.md#budget-controls
  - alert: AskBlogErrorRate
    expr: "sum(increase(seo_ask_requests_total{job=\"seo-agent\", outcome=\"error\"}[30m]))\n  / clamp_min(sum(increase(seo_ask_requests_total{job=\"seo-agent\"}[30m])), 1) > 0.2\nand sum(increase(seo_ask_requests_total{job=\"\
      seo-agent\"}[30m])) >= 10\n"
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: 'Ask the Blog: more than 20% of answers fail (kill switch: ASK_BLOG_ENABLED=false)'
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/seo/RAG.md#operations
- name: jithendar-com-seo-ml
  rules:
  - alert: SeoMlFlowFailing
    expr: max(seo_ml_flow_consecutive_failures{job="seo-agent"}) >= 2
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: seo_ml_flow failed {{ $value }} times in a row
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/seo/ML.md#overriding-and-rolling-back
  - alert: SeoMlModelFellBackToRule
    expr: sum by (model) (increase(seo_ml_train_runs_total{job="seo-agent", status="fallback_to_rule"}[8d])) > 0
    labels:
      severity: info
    annotations:
      summary: The {{ $labels.model }} model fell below its rule on retraining; the site uses the rule again
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/seo/ML.md#model-or-rule-srclibseo-intelmlts-mldecision
  - alert: SeoRagChunksTruncated
    expr: sum(increase(seo_rag_chunks_truncated_total{job="seo-agent"}[1d])) > 0
    labels:
      severity: warning
    annotations:
      summary: '{{ $value }} chunks were longer than the embedding model accepts during reindexing (their tails are not searchable)'
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/seo/RAG.md#chunking-v5-token-budget
- name: jithendar-com-news
  rules:
  - alert: NewsJobFailingRepeatedly
    expr: max by (news_job) (news_job_consecutive_failures{job="seo-agent"}) >= 2
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: News job {{ $labels.news_job }} failed twice in a row
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/news/RUNBOOK.md#job-failing
  - alert: NewsSourceFailing24h
    expr: max(news_source_failing_seconds{job="seo-agent"}) > 86400
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: A news source has been failing for more than 24 hours
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/news/RUNBOOK.md#source-failing
  - alert: NewsQualityFailureRateHigh
    expr: max(news_quality_failure_ratio_7d{job="seo-agent"}) > 0.5
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: Over half of news drafts failed the quality gates in the last 7 days
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/news/RUNBOOK.md#quality-failures
  - alert: NewsBudget80Percent
    expr: max by (scope) (news_budget_used_ratio{job="seo-agent"}) >= 0.8 and max by (scope) (news_budget_used_ratio{job="seo-agent"}) < 1
    for: 10m
    labels:
      severity: info
    annotations:
      summary: News budget {{ $labels.scope }} at {{ $value | humanizePercentage }}
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/news/RUNBOOK.md#budget
  - alert: NewsBudgetReached
    expr: max by (scope) (news_budget_used_ratio{job="seo-agent"}) >= 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: 'News budget {{ $labels.scope }} reached: runs pause until the period resets or the cap is raised'
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/news/RUNBOOK.md#budget
  - alert: NewsJobNoDrafts
    expr: (time() - max by (news_job) (news_job_last_draft_timestamp_seconds{job="seo-agent"})) > 3 * 86400 and max by (news_job) (news_job_last_draft_timestamp_seconds{job="seo-agent"}) > 0
    for: 1h
    labels:
      severity: info
    annotations:
      summary: News job {{ $labels.news_job }} has produced no draft for review in 3 days
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/news/RUNBOOK.md#no-drafts
- name: jithendar-com-cache-bus
  rules:
  - alert: CacheBusDisconnected
    expr: max(cache_bus_connected{job="jithendar-com", role="subscriber"}) == 0
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: 'Cache bus: no site pod is subscribed to Valkey for 15 minutes (caches converge only after their TTL)'
      description: Check Admin → System status (Cache bus), the site logs (event cache_bus_subscriber), Secret jithendar/redis-site-cachebus-credentials, NetworkPolicy jithendar-com-cache-bus (pod port
        6380) and the Valkey pods in namespace redis.
      runbook_url: https://github.com/moks-tech/moks-cms/blob/master/docs/redis-site-cachebus.md#troubleshooting
