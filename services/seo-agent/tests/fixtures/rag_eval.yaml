# Retrieval evaluation set for Ask the Blog / search_articles / vector_search (docs/seo/RAG.md "Evaluation").
#
# Each question was written from the published articles in services/www/content/blog (2026-11-10, 37 articles).
#   slugs:   the article(s) that answer it (any one counts as a hit)
#   anchors: acceptable section anchors (github-slugger ids, as on the site); a hit in one of these is a
#            "section-anchor hit". Empty for no-answer questions.
#   type:    concept | how-to | exact-term (a command, flag, config key, error string or version) | troubleshooting |
#            no-answer (not covered on the site: retrieval should give the grader nothing convincing)
# Rules for editing: keep at least 40 questions and at least 6 no-answer; don't tune questions to a retriever (write
# them the way a reader would ask); when an article is renamed or restructured, fix its slugs/anchors here.
