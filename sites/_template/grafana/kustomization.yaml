# This site's Grafana dashboards: one ConfigMap per site, in namespace monitoring, which Grafana loads read-only.
# Rename the ConfigMap after the site (grafana-dashboards-<domain with dashes>) and list every dashboard JSON file
# in this folder under `files`. Dashboard uids must be unique across all sites: prefix them with the site's name.
# scripts/check-dashboards.py and .github/workflows/grafana-dashboards.yml check this folder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- name: grafana-dashboards-example-com
  namespace: monitoring
  files: []
  options:
    disableNameSuffixHash: true
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true
